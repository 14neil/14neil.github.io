<!-- Research Section -->
<section id="research">
  <div class="container portfolio-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Research</h2>
        <hr class="star-primary">
      </div>
    </div>

    <div class="portfolio-flex-row">
      {% for post in site.posts %}
        {% if post.category == "research" %}
          <div class="portfolio-flex-item portfolio-item">
            <a href="#portfolioModal-{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
              <div class="caption">
                <div class="caption-content">
                  <i class="fa fa-search-plus fa-3x"></i>
                </div>
              </div>
              <img src="img/portfolio/{{ post.img }}" class="img-responsive" alt="{{ post.alt }}" style="width: 100%; max-width: 900px; height: auto;">
            </a>
          </div>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</section>
