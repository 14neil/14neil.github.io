<!-- Teaching Section -->
<section id="teaching">
  <div class="container-fluid portfolio-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Teaching</h2>
        <hr class="moon_wg">
      </div>
    </div>
    <div class="portfolio-flex-row">
      {% for post in site.posts %}
        {% if post.category == "teaching" %}
          <div class="portfolio-flex-item portfolio-item">
            <a href="#portfolioModal-{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
              <div class="caption">
                <div class="caption-content">
                  <h4>{{ post.title }}</h4>
                </div>
              </div>
              <img src="img/portfolio/webp/{{ post.img }}" class="img-fluid d-block mx-auto" alt="{{ post.alt }}">
            </a>
          </div>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</section>
